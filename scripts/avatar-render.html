<!doctype html>
<html>
  <body style="margin:0;background:transparent">
    <!-- Dev: chụp ảnh chân dung skin (mở qua `npm run dev` tại /scripts/avatar-render.html). -->
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
      const SIZE = 256
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true })
      renderer.setSize(SIZE, SIZE)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      document.body.appendChild(renderer.domElement)
      const loader = new GLTFLoader()
      window.renderAvatar = async (url, full = false, yaw = 0) => {
        const gltf = await loader.loadAsync(url)
        const scene = new THREE.Scene()
        scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c4d6, 2.2))
        const sun = new THREE.DirectionalLight(0xffffff, 1.6)
        sun.position.set(1, 2, 3)
        scene.add(sun)
        const model = gltf.scene
        model.rotation.y = yaw
        scene.add(model)
        const box = new THREE.Box3().setFromObject(model)
        const size = box.getSize(new THREE.Vector3())
        const top = box.max.y
        const span = full ? size.y * 0.62 : size.y * 0.42
        const cy = full ? (box.min.y + top) / 2 : top - span * 0.92
        const cam = new THREE.OrthographicCamera(-span, span, span, -span, 0.01, 100)
        cam.position.set(0, cy + span * 0.15, 10)
        cam.lookAt(0, cy, 0)
        renderer.render(scene, cam)
        return renderer.domElement.toDataURL('image/png')
      }
      window.ready = true
    </script>
  </body>
</html>
